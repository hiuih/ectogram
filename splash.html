<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(160deg, #1a1a1a 0%, #0c0d10 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-app-region: drag;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .badge {
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 24px;
    background: linear-gradient(135deg, #FEDA75 0%, #FA7E1E 35%, #D62976 65%, #962FBF 85%, #4F5BD5 100%);
    box-shadow: 0 0 60px rgba(214, 41, 118, 0.35), 0 8px 30px rgba(0,0,0,0.4);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .badge svg { width: 46px; height: 46px; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .title {
    color: #f2f2f2;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    opacity: 0.85;
  }
  .dots span {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin: 0 3px;
    border-radius: 50%;
    background: #D62976;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-4px); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">
      <svg viewBox="0 0 100 100" width="52" height="52" fill="none">
        <rect x="14" y="34" width="72" height="46" rx="11" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
        <rect x="37" y="20" width="26" height="14" rx="5" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
        <circle cx="50" cy="58" r="15" stroke="#FFFFFF" stroke-width="6"/>
        <circle cx="73" cy="45" r="2.8" fill="#FFFFFF"/>
      </svg>
    </div>
    <div class="title">Loading Ectogram</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</body>
</html>
